<!DOCTYPE html><html lang="tr"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>CafePlay - Kasa girişi</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                "colors": {
                    "surface": "#FFFFFF",
                    "surface-alt": "#FAFAFA",
                    "surface-sunk": "#F2F2F2",
                    "surface-container-highest": "#e5e2e1",
                    "border-noble": "#E5E5E5",
                    "outline-variant": "#c3c6d6",
                    "text-charcoal": "#1F1F1F",
                    "text-muted": "#6B6B6B",
                    "on-surface": "#1b1b1c",
                    "on-surface-variant": "#424654",
                    "primary": "#0B57D0",
                    "on-primary": "#ffffff",
                    "on-primary-fixed-variant": "#0040a1",
                    "primary-fixed": "#dae2ff",
                    "reward-gold": "#D4AF37",
                    "reward-ink": "#856612",
                    "reward-fixed": "#FBF3DC",
                    "danger-red": "#D93025",
                    "danger-fixed": "#FDECEA"
                },
                "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "1rem",
                    "full": "9999px"
                },
                "spacing": {
                    "base": "4px",
                    "unit-1": "4px",
                    "unit-2": "8px",
                    "unit-3": "12px",
                    "unit-4": "16px",
                    "unit-6": "24px",
                    "unit-8": "32px",
                    "margin-mobile": "20px",
                    "gutter-mobile": "12px"
                },
                "fontFamily": {
                    "display-lg": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "headline-md": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "title-sm": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "body-md": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "label-caps": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "data-mono": ["JetBrains Mono", "ui-monospace", "SFMono-Regular", "monospace"],
                    "sans": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "mono": ["JetBrains Mono", "ui-monospace", "SFMono-Regular", "monospace"]
                },
                "fontSize": {
                    "display-lg": ["48px", { "lineHeight": "52px", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                    "headline-md": ["24px", { "lineHeight": "30px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                    "title-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                    "body-md": ["16px", { "lineHeight": "26px", "fontWeight": "400" }],
                    "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                    "data-mono": ["14px", { "lineHeight": "20px", "fontWeight": "500" }]
                }
            }
        }
    }
</script>
<style>
    /* Taban font — hiçbir metin tarayıcı varsayılanına düşmesin.
       Ekranlar arası "font farklı görünüyor" sorununun ikinci kaynağı buydu. */
    html, body, button, input, select, textarea {
        font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
    }
    /* İmza doku: ilerleme çubuklarının -45° çizgisi. */
    .noble-stripe {
        background-image: repeating-linear-gradient(
            -45deg,
            rgba(255, 255, 255, 0.15),
            rgba(255, 255, 255, 0.15) 10px,
            transparent 10px,
            transparent 20px
        );
    }
    .tabular { font-variant-numeric: tabular-nums; }
    ::-webkit-scrollbar { display: none; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: .01ms !important;
            transition-duration: .01ms !important;
        }
    }
</style>
</head>
<body class="bg-surface-alt text-text-charcoal font-body-md antialiased min-h-screen flex flex-col items-center justify-center px-unit-6">
<div class="sticky top-0 z-50 w-full border-b border-reward-gold bg-reward-fixed px-margin-mobile py-unit-3">
<div class="mx-auto flex w-full max-w-4xl items-center gap-unit-4">
<span class="material-symbols-outlined text-[20px] text-reward-ink">construction</span>
<div class="min-w-0 flex-1">
<div class="font-label-caps text-label-caps text-reward-ink">GELİŞTİRME · KASİYER PIN'İ</div>
<div class="text-sm text-text-muted">Geliştirme tohumundaki PIN. Canlıda bu şerit hiç görünmez.</div>
</div>
<span class="tabular shrink-0 font-data-mono text-[24px] font-bold tracking-[0.2em] text-text-charcoal">1234</span>
</div>
</div>
<!--
  C1 · /kasa/giris — kasadaki tablet.

  Kasa yüzeyi oyuncu yüzeyiyle AYNI sistem, bir beden büyük: 36px PIN alanı,
  24px dikey dolgu, tek elle erişilebilir. Loş kafede, kalabalık kasada,
  üç saniyede.

  Kasiyer hiçbir şey SEÇMİYOR — tabletini alıp dört hane giriyor. Kafe kimliği
  cihazdan çözülüyor.
-->

<div class="mb-unit-8 flex flex-col items-center text-center">
  <div class="font-label-caps text-label-caps tracking-[0.3em] text-primary">CAFEPLAY</div>
  <h1 class="mt-unit-2 font-display-lg text-[36px] leading-[40px] tracking-[-0.04em] text-text-charcoal font-extrabold">Kasa</h1>
  <p class="mt-unit-3 max-w-[288px] text-sm leading-relaxed text-text-muted">
    Kupon onaylamak için personel PIN'inle gir. Oturum sekiz saat açık kalır.
  </p>
</div>

<form class="flex w-full max-w-xs flex-col">

  <label class="flex flex-col gap-unit-3">
    <span class="text-center font-label-caps text-label-caps text-text-muted">PERSONEL PIN'İ</span>
    <input
      autocomplete="off"
      class="tabular rounded-lg border-none bg-surface-sunk py-unit-6 text-center font-data-mono text-[36px] tracking-[0.5em] text-text-charcoal placeholder:text-text-muted focus:outline-none focus:ring-2 focus:ring-primary font-medium"
      inputmode="numeric"
      maxlength="4"
      placeholder="••••"
      type="password"/>
  </label>

  <button class="mt-unit-6 w-full rounded-lg bg-primary py-unit-6 font-title-sm text-[18px] text-on-primary transition-transform active:scale-95 font-semibold" type="button">
    Giriş
  </button>
</form>

<p class="mt-unit-8 max-w-xs text-center text-sm leading-relaxed text-text-muted">
  PIN yalnızca işletme yöneticisinin kaydettiği cihazlarda çalışır.
</p>
<script src="../gezinme.js"></script>
</body></html>
