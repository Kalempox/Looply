<!DOCTYPE html><html lang="tr"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>CafePlay - Oyun — Düşen</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                "colors": {
                    "surface": "#FFFFFF",
                    "surface-alt": "#FAFAFA",
                    "surface-sunk": "#F2F2F2",
                    "surface-container-highest": "#e5e2e1",
                    "border-noble": "#E5E5E5",
                    "outline-variant": "#c3c6d6",
                    "text-charcoal": "#1F1F1F",
                    "text-muted": "#6B6B6B",
                    "on-surface": "#1b1b1c",
                    "on-surface-variant": "#424654",
                    "primary": "#0B57D0",
                    "on-primary": "#ffffff",
                    "on-primary-fixed-variant": "#0040a1",
                    "primary-fixed": "#dae2ff",
                    "reward-gold": "#D4AF37",
                    "reward-ink": "#856612",
                    "reward-fixed": "#FBF3DC",
                    "danger-red": "#D93025",
                    "danger-fixed": "#FDECEA"
                },
                "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "1rem",
                    "full": "9999px"
                },
                "spacing": {
                    "base": "4px",
                    "unit-1": "4px",
                    "unit-2": "8px",
                    "unit-3": "12px",
                    "unit-4": "16px",
                    "unit-6": "24px",
                    "unit-8": "32px",
                    "margin-mobile": "20px",
                    "gutter-mobile": "12px"
                },
                "fontFamily": {
                    "display-lg": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "headline-md": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "title-sm": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "body-md": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "label-caps": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "data-mono": ["JetBrains Mono", "ui-monospace", "SFMono-Regular", "monospace"],
                    "sans": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "mono": ["JetBrains Mono", "ui-monospace", "SFMono-Regular", "monospace"]
                },
                "fontSize": {
                    "display-lg": ["48px", { "lineHeight": "52px", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                    "headline-md": ["24px", { "lineHeight": "30px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                    "title-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                    "body-md": ["16px", { "lineHeight": "26px", "fontWeight": "400" }],
                    "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                    "data-mono": ["14px", { "lineHeight": "20px", "fontWeight": "500" }]
                }
            }
        }
    }
</script>
<style>
    /* Taban font — hiçbir metin tarayıcı varsayılanına düşmesin.
       Ekranlar arası "font farklı görünüyor" sorununun ikinci kaynağı buydu. */
    html, body, button, input, select, textarea {
        font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
    }
    /* İmza doku: ilerleme çubuklarının -45° çizgisi. */
    .noble-stripe {
        background-image: repeating-linear-gradient(
            -45deg,
            rgba(255, 255, 255, 0.15),
            rgba(255, 255, 255, 0.15) 10px,
            transparent 10px,
            transparent 20px
        );
    }
    .tabular { font-variant-numeric: tabular-nums; }
    ::-webkit-scrollbar { display: none; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: .01ms !important;
            transition-duration: .01ms !important;
        }
    }
</style>
</head>
<body class="bg-surface-alt text-text-charcoal font-body-md text-body-md antialiased h-screen w-full flex flex-col overflow-hidden select-none">
<!--
  B5 · Düşen — 10×16 kuyu, 3/4/5 hücreli karışık parça seti (Ü22).

  Tetris'in yedi parçalık dört hücreli seti bilerek alınmadı — hem hukuki
  mesafe hem de oyun gerçekten farklı oynansın diye.

  Zaman VAR ama saniye değil TICK. Ekranda saniye sayacı gösterilmiyor;
  gösterilen şey seviye ve temizlenen satır.
-->

<header class="flex w-full items-center justify-between border-b border-border-noble bg-surface px-margin-mobile py-unit-3">
  <div class="flex items-center gap-unit-2">
    <span class="material-symbols-outlined cursor-pointer text-primary">arrow_back</span>
    <div class="font-label-caps text-label-caps uppercase text-text-muted">DÜŞEN · 3. BÖLÜM</div>
  </div>
  <div class="flex flex-col items-end">
    <span class="tabular font-data-mono text-data-mono font-bold text-primary">2.140</span>
    <span class="font-label-caps text-[10px] tracking-[0.05em] text-text-muted font-semibold">SKOR</span>
  </div>
</header>

<main class="flex flex-1 items-start justify-center gap-unit-4 px-margin-mobile pt-unit-4">

  <!-- Kuyu: 10 geniş × 16 yüksek -->
  <div class="touch-none rounded-lg border border-border-noble bg-surface p-unit-2">
    <div class="grid h-[384px] w-[240px] grid-cols-10 grid-rows-16 gap-[2px]">
      <!-- 1–4. satır boş -->
      <div class="col-span-10 row-span-4 grid grid-cols-10 grid-rows-4 gap-[2px]">
        <div class="col-span-10 row-span-4 rounded-sm bg-surface-sunk"></div>
      </div>

      <!-- 5. satır: düşen parça (altın) + iniş önizlemesi -->
      <div class="col-span-10 row-span-1 grid grid-cols-10 gap-[2px]">
        <div class="rounded-sm bg-surface-sunk"></div><div class="rounded-sm bg-surface-sunk"></div>
        <div class="rounded-sm bg-surface-sunk"></div>
        <div class="noble-stripe rounded-sm bg-reward-gold"></div>
        <div class="noble-stripe rounded-sm bg-reward-gold"></div>
        <div class="noble-stripe rounded-sm bg-reward-gold"></div>
        <div class="rounded-sm bg-surface-sunk"></div><div class="rounded-sm bg-surface-sunk"></div>
        <div class="rounded-sm bg-surface-sunk"></div><div class="rounded-sm bg-surface-sunk"></div>
      </div>
      <div class="col-span-10 row-span-1 grid grid-cols-10 gap-[2px]">
        <div class="rounded-sm bg-surface-sunk"></div><div class="rounded-sm bg-surface-sunk"></div>
        <div class="rounded-sm bg-surface-sunk"></div><div class="rounded-sm bg-surface-sunk"></div>
        <div class="noble-stripe rounded-sm bg-reward-gold"></div>
        <div class="noble-stripe rounded-sm bg-reward-gold"></div>
        <div class="rounded-sm bg-surface-sunk"></div><div class="rounded-sm bg-surface-sunk"></div>
        <div class="rounded-sm bg-surface-sunk"></div><div class="rounded-sm bg-surface-sunk"></div>
      </div>

      <!-- 7–10. satır boş -->
      <div class="col-span-10 row-span-4 rounded-sm bg-surface-sunk"></div>

      <!-- 11. satır: iniş önizlemesi — dolgusuz, 1px mavi kontur -->
      <div class="col-span-10 row-span-1 grid grid-cols-10 gap-[2px]">
        <div class="rounded-sm bg-surface-sunk"></div><div class="rounded-sm bg-surface-sunk"></div>
        <div class="rounded-sm bg-surface-sunk"></div>
        <div class="rounded-sm border border-primary"></div>
        <div class="rounded-sm border border-primary"></div>
        <div class="rounded-sm border border-primary"></div>
        <div class="rounded-sm bg-surface-sunk"></div><div class="rounded-sm bg-surface-sunk"></div>
        <div class="rounded-sm bg-surface-sunk"></div><div class="rounded-sm bg-surface-sunk"></div>
      </div>
      <div class="col-span-10 row-span-1 grid grid-cols-10 gap-[2px]">
        <div class="rounded-sm bg-surface-sunk"></div><div class="rounded-sm bg-surface-sunk"></div>
        <div class="rounded-sm bg-surface-sunk"></div><div class="rounded-sm bg-surface-sunk"></div>
        <div class="rounded-sm border border-primary"></div>
        <div class="rounded-sm border border-primary"></div>
        <div class="rounded-sm bg-surface-sunk"></div><div class="rounded-sm bg-surface-sunk"></div>
        <div class="rounded-sm bg-surface-sunk"></div><div class="rounded-sm bg-surface-sunk"></div>
      </div>

      <!-- 13–16. satır: kilitlenmiş hücreler (mavi) -->
      <div class="col-span-10 row-span-1 grid grid-cols-10 gap-[2px]">
        <div class="rounded-sm bg-surface-sunk"></div>
        <div class="rounded-sm bg-primary"></div><div class="rounded-sm bg-primary"></div>
        <div class="rounded-sm bg-surface-sunk"></div><div class="rounded-sm bg-surface-sunk"></div>
        <div class="rounded-sm bg-surface-sunk"></div>
        <div class="rounded-sm bg-primary"></div>
        <div class="rounded-sm bg-surface-sunk"></div><div class="rounded-sm bg-surface-sunk"></div>
        <div class="rounded-sm bg-surface-sunk"></div>
      </div>
      <div class="col-span-10 row-span-1 grid grid-cols-10 gap-[2px]">
        <div class="rounded-sm bg-primary"></div><div class="rounded-sm bg-primary"></div>
        <div class="rounded-sm bg-primary"></div><div class="rounded-sm bg-surface-sunk"></div>
        <div class="rounded-sm bg-primary"></div><div class="rounded-sm bg-primary"></div>
        <div class="rounded-sm bg-primary"></div><div class="rounded-sm bg-surface-sunk"></div>
        <div class="rounded-sm bg-primary"></div><div class="rounded-sm bg-surface-sunk"></div>
      </div>
      <!-- Temizlenmek üzere olan satır: altın -->
      <div class="col-span-10 row-span-1 grid grid-cols-10 gap-[2px]">
        <div class="noble-stripe rounded-sm bg-reward-gold"></div><div class="noble-stripe rounded-sm bg-reward-gold"></div>
        <div class="noble-stripe rounded-sm bg-reward-gold"></div><div class="noble-stripe rounded-sm bg-reward-gold"></div>
        <div class="noble-stripe rounded-sm bg-reward-gold"></div><div class="noble-stripe rounded-sm bg-reward-gold"></div>
        <div class="noble-stripe rounded-sm bg-reward-gold"></div><div class="noble-stripe rounded-sm bg-reward-gold"></div>
        <div class="noble-stripe rounded-sm bg-reward-gold"></div><div class="noble-stripe rounded-sm bg-reward-gold"></div>
      </div>
      <div class="col-span-10 row-span-1 grid grid-cols-10 gap-[2px]">
        <div class="rounded-sm bg-primary"></div><div class="rounded-sm bg-surface-sunk"></div>
        <div class="rounded-sm bg-primary"></div><div class="rounded-sm bg-primary"></div>
        <div class="rounded-sm bg-primary"></div><div class="rounded-sm bg-surface-sunk"></div>
        <div class="rounded-sm bg-primary"></div><div class="rounded-sm bg-primary"></div>
        <div class="rounded-sm bg-primary"></div><div class="rounded-sm bg-surface-sunk"></div>
      </div>
    </div>
  </div>

  <!-- Yan sütun -->
  <aside class="flex w-[88px] flex-col gap-unit-4 pt-unit-2">
    <div>
      <div class="mb-unit-2 font-label-caps text-label-caps text-text-muted">SIRADAKİ</div>
      <div class="flex h-16 items-center justify-center rounded-lg border border-border-noble bg-surface">
        <!-- 5 hücreli parça — Ü22'nin karışık seti -->
        <div class="grid grid-cols-3 grid-rows-2 gap-[2px]">
          <div class="h-4 w-4 rounded-[2px] bg-primary"></div>
          <div class="h-4 w-4"></div>
          <div class="h-4 w-4 rounded-[2px] bg-primary"></div>
          <div class="h-4 w-4 rounded-[2px] bg-primary"></div>
          <div class="h-4 w-4 rounded-[2px] bg-primary"></div>
          <div class="h-4 w-4 rounded-[2px] bg-primary"></div>
        </div>
      </div>
    </div>
    <div>
      <div class="mb-1 font-label-caps text-label-caps text-text-muted">SATIR</div>
      <div class="tabular font-data-mono text-[20px] font-bold text-text-charcoal">7</div>
    </div>
    <div>
      <div class="mb-1 font-label-caps text-label-caps text-text-muted">HEDEF</div>
      <div class="tabular font-data-mono text-data-mono text-text-muted">8</div>
    </div>
  </aside>
</main>

<!-- Dokunma kontrolleri: 56×56, tek elle erişilebilir -->
<div class="flex w-full justify-center gap-unit-3 px-margin-mobile py-unit-4">
  <button aria-label="Sola" class="flex h-14 w-14 items-center justify-center rounded-lg border border-border-noble bg-surface text-text-charcoal transition-transform active:scale-95" type="button">
    <span class="material-symbols-outlined">chevron_left</span>
  </button>
  <button aria-label="Döndür" class="flex h-14 w-14 items-center justify-center rounded-lg border border-border-noble bg-surface text-text-charcoal transition-transform active:scale-95" type="button">
    <span class="material-symbols-outlined">rotate_right</span>
  </button>
  <button aria-label="Sağa" class="flex h-14 w-14 items-center justify-center rounded-lg border border-border-noble bg-surface text-text-charcoal transition-transform active:scale-95" type="button">
    <span class="material-symbols-outlined">chevron_right</span>
  </button>
  <button aria-label="Hızlı indir" class="flex h-14 w-14 items-center justify-center rounded-lg bg-primary text-on-primary transition-transform active:scale-95" type="button">
    <span class="material-symbols-outlined">keyboard_double_arrow_down</span>
  </button>
</div>

<footer class="w-full bg-surface-alt px-margin-mobile pb-unit-3 text-center">
  <div class="animate-pulse font-data-mono text-[11px] text-text-muted opacity-80 font-medium">
    Sunucu skorunu doğruluyor…
  </div>
</footer>
<script src="../gezinme.js"></script>
</body></html>
