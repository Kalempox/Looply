<!-- baslik: Oyun — Kelime -->
<!-- govde: bg-surface-alt text-text-charcoal font-body-md text-body-md antialiased h-screen w-full flex flex-col overflow-hidden select-none -->

<!--
  B5 · Kelime — harf setinden kelime çıkarma.

  Ü21: bu oyunun girdisi "gönderilen kelime", ZAMAN YOK. Ekranda sayaç
  gösterilmemeli — sunucu doğrulaması süreye bakmıyor, harf setine bakıyor.
-->

<header class="flex w-full items-center justify-between border-b border-border-noble bg-surface px-margin-mobile py-unit-3">
  <div class="flex items-center gap-unit-2">
    <span class="material-symbols-outlined cursor-pointer text-primary">arrow_back</span>
    <div class="font-label-caps text-label-caps uppercase text-text-muted">KELİME · 2. BÖLÜM</div>
  </div>
  <div class="flex flex-col items-end">
    <span class="tabular font-data-mono text-data-mono font-bold text-primary">840</span>
    <span class="font-label-caps text-[10px] tracking-[0.05em] text-text-muted font-semibold">SKOR</span>
  </div>
</header>

<main class="relative flex flex-1 flex-col items-center px-margin-mobile pt-unit-6">

  <!-- Hedef -->
  <div class="mb-unit-6 flex w-full max-w-[340px] items-end justify-between px-unit-2">
    <div>
      <div class="mb-1 font-label-caps text-label-caps text-text-muted">HEDEF</div>
      <div class="tabular font-data-mono text-data-mono text-text-charcoal">4 / 5 kelime</div>
    </div>
    <div class="text-right">
      <div class="mb-1 font-label-caps text-label-caps text-text-muted">EN UZUN</div>
      <div class="tabular font-data-mono text-data-mono text-reward-ink">6 harf</div>
    </div>
  </div>

  <!-- Kurulan kelime -->
  <div class="mb-unit-6 flex h-12 items-center">
    <span class="tabular font-data-mono text-[24px] font-bold tracking-[0.35em] text-text-charcoal">KİTAP</span>
  </div>

  <!-- Harf seti -->
  <div class="mb-unit-8 flex w-full max-w-[340px] flex-wrap justify-center gap-unit-2">
    <button class="flex h-16 w-16 items-center justify-center rounded-lg border border-primary bg-primary font-display-lg text-[28px] font-extrabold text-on-primary transition-transform active:scale-95 tracking-[-0.04em]" type="button">K</button>
    <button class="flex h-16 w-16 items-center justify-center rounded-lg border border-primary bg-primary font-display-lg text-[28px] font-extrabold text-on-primary transition-transform active:scale-95 tracking-[-0.04em]" type="button">İ</button>
    <button class="flex h-16 w-16 items-center justify-center rounded-lg border border-primary bg-primary font-display-lg text-[28px] font-extrabold text-on-primary transition-transform active:scale-95 tracking-[-0.04em]" type="button">T</button>
    <button class="flex h-16 w-16 items-center justify-center rounded-lg border border-primary bg-primary font-display-lg text-[28px] font-extrabold text-on-primary transition-transform active:scale-95 tracking-[-0.04em]" type="button">A</button>
    <button class="flex h-16 w-16 items-center justify-center rounded-lg border border-primary bg-primary font-display-lg text-[28px] font-extrabold text-on-primary transition-transform active:scale-95 tracking-[-0.04em]" type="button">P</button>
    <button class="flex h-16 w-16 items-center justify-center rounded-lg border border-border-noble bg-surface font-display-lg text-[28px] font-extrabold text-text-charcoal transition-transform active:scale-95 tracking-[-0.04em]" type="button">L</button>
  </div>

  <!-- Eylemler -->
  <div class="mb-unit-6 flex w-full max-w-[340px] gap-unit-3">
    <button class="flex flex-1 items-center justify-center gap-unit-2 rounded-lg border border-border-noble bg-surface py-unit-3 font-title-sm text-title-sm text-text-charcoal transition-transform active:scale-95" type="button">
      <span class="material-symbols-outlined text-[20px]">shuffle</span>
      Karıştır
    </button>
    <button class="flex-1 rounded-lg bg-primary py-unit-3 font-title-sm text-title-sm text-on-primary transition-transform active:scale-95" type="button">
      Gönder
    </button>
  </div>

  <!-- Bulunanlar -->
  <div class="w-full max-w-[340px]">
    <div class="mb-unit-2 font-label-caps text-label-caps text-text-muted">BULDUKLARIN</div>
    <div class="flex flex-wrap gap-unit-2">
      <span class="rounded border border-border-noble bg-surface px-unit-3 py-1 font-data-mono text-[12px] text-text-charcoal font-medium">TAKİP</span>
      <span class="rounded border border-border-noble bg-surface px-unit-3 py-1 font-data-mono text-[12px] text-text-charcoal font-medium">KAPI</span>
      <span class="rounded border border-border-noble bg-surface px-unit-3 py-1 font-data-mono text-[12px] text-text-charcoal font-medium">TİP</span>
      <span class="rounded border border-border-noble bg-surface px-unit-3 py-1 font-data-mono text-[12px] text-text-charcoal font-medium">PAK</span>
      <!-- Reddedilen kelime: kırmızı kenarlıkla bir an yanıp söner -->
      <span class="rounded border border-danger-red bg-danger-fixed px-unit-3 py-1 font-data-mono text-[12px] text-danger-red font-medium">KTAP</span>
    </div>
  </div>
</main>

<footer class="mt-auto w-full bg-surface-alt px-margin-mobile py-unit-3 text-center">
  <div class="animate-pulse font-data-mono text-[11px] text-text-muted opacity-80 font-medium">
    Sunucu skorunu doğruluyor…
  </div>
</footer>
