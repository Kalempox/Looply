<header class="mb-unit-8 text-center">
  <div class="font-label-caps text-label-caps tracking-[0.28em] text-primary">CAFEPLAY KASA</div>
  <h1 class="mt-unit-1 font-headline-md text-headline-md text-text-charcoal">Kupon onayı</h1>
</header>

<div class="flex w-full max-w-md flex-col gap-unit-8">
<div class="relative aspect-[4/3] w-full overflow-hidden rounded-lg border border-border-noble bg-surface-sunk">
      <!-- Dört köşe ayracı — lazer çizgisi yok, tarama animasyonu yok -->
      <span class="absolute left-unit-4 top-unit-4 h-8 w-8 border-l-2 border-t-2 border-primary"></span>
      <span class="absolute right-unit-4 top-unit-4 h-8 w-8 border-r-2 border-t-2 border-primary"></span>
      <span class="absolute bottom-unit-4 left-unit-4 h-8 w-8 border-b-2 border-l-2 border-primary"></span>
      <span class="absolute bottom-unit-4 right-unit-4 h-8 w-8 border-b-2 border-r-2 border-primary"></span>
      <span class="absolute inset-0 flex items-center justify-center font-label-caps text-label-caps text-text-muted">KAMERA GÖRÜNTÜSÜ</span>
    </div>
    <button class="mt-unit-3 w-full rounded-lg border border-border-noble bg-surface py-unit-3 text-sm text-text-muted" type="button">Kamerayı kapat</button>

    <div class="mt-unit-4 rounded-lg border border-danger-red bg-danger-fixed px-unit-4 py-unit-3">
      <span class="text-sm text-danger-red">Kameraya erişilemedi. Kodu elle girebilirsin.</span>
    </div>
</div>
