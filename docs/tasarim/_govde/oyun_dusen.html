<!-- baslik: Oyun — Düşen -->
<!-- govde: bg-surface-alt text-text-charcoal font-body-md text-body-md antialiased h-screen w-full flex flex-col overflow-hidden select-none -->

<!--
  B5 · Düşen — 10×16 kuyu, 3/4/5 hücreli karışık parça seti (Ü22).

  Tetris'in yedi parçalık dört hücreli seti bilerek alınmadı — hem hukuki
  mesafe hem de oyun gerçekten farklı oynansın diye.

  Zaman VAR ama saniye değil TICK. Ekranda saniye sayacı gösterilmiyor;
  gösterilen şey seviye ve temizlenen satır.
-->

<header class="flex w-full items-center justify-between border-b border-border-noble bg-surface px-margin-mobile py-unit-3">
  <div class="flex items-center gap-unit-2">
    <span class="material-symbols-outlined cursor-pointer text-primary">arrow_back</span>
    <div class="font-label-caps text-label-caps uppercase text-text-muted">DÜŞEN · 3. BÖLÜM</div>

      </div>

      <!-- 5. satır: düşen parça (altın) + iniş önizlemesi -->

      <!-- 7–10. satır boş -->
      <div class="col-span-10 row-span-4 rounded-sm bg-surface-sunk"></div>

      <!-- 11. satır: iniş önizlemesi — dolgusuz, 1px mavi kontur -->

        <div class="rounded-sm bg-surface-sunk"></div><div class="rounded-sm bg-surface-sunk"></div>
        <div class="rounded-sm bg-surface-sunk"></div>
        <div class="rounded-sm border border-primary"></div>

    <div>
      <div class="mb-unit-2 font-label-caps text-label-caps text-text-muted">SIRADAKİ</div>
      <div class="flex h-16 items-center justify-center rounded-lg border border-border-noble bg-surface">

<!-- Dokunma kontrolleri: 56×56, tek elle erişilebilir -->
<div class="flex w-full justify-center gap-unit-3 px-margin-mobile py-unit-4">
  <button aria-label="Sola" class="flex h-14 w-14 items-center justify-center rounded-lg border border-border-noble bg-surface text-text-charcoal transition-transform active:scale-95" type="button">
