<main class="w-full max-w-md flex flex-col gap-unit-8">

<span class="font-label-caps text-label-caps text-text-muted">BLOK · 1. BÖLÜM</span>
<h2 class="font-headline-md text-headline-md text-text-charcoal">Bölüm tamam</h2>
<!-- SKOR ≠ PUAN. Skor oyunun sonucu, puan kazanımdır (aşağıda +300).
     İkisi karışırsa oyuncu 1.240 puan kazandığını sanar. -->
<span class="font-label-caps text-label-caps text-text-muted">SKOR</span>
<div class="tabular font-data-mono text-display-lg text-primary">1.240</div>
<span class="font-data-mono text-[11px] font-medium text-text-muted">sunucuda doğrulandı</span>
</section>
<!-- Earnings Rows -->
<section class="bg-surface rounded-xl border border-border-noble p-unit-4 flex flex-col gap-unit-4">
<div class="flex justify-between items-center border-b border-border-noble pb-unit-3">
<span class="font-body-md text-body-md text-text-charcoal">Bölüm Puanı</span>
<span class="font-data-mono text-data-mono text-primary font-bold">+300 puan</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-text-charcoal">Tecrübe Puanı (XP)</span>
<span class="font-data-mono text-data-mono text-reward-ink font-bold">+50 XP</span>
</div>
</section>
<!-- Reward Card -->
<section class="bg-surface rounded-xl border border-reward-gold p-unit-6 flex flex-col gap-unit-2 items-center text-center">
<div class="flex items-center gap-unit-2">
<span class="material-symbols-outlined text-reward-ink" style="font-variation-settings: 'FILL' 1;">local_activity</span>
<span class="font-label-caps text-label-caps text-reward-ink">ÖDÜL KAZANDIN</span>
</div>
<h3 class="font-title-sm text-title-sm text-text-charcoal">Ücretsiz kurabiye</h3>

<p class="font-body-md text-body-md text-text-muted text-sm mt-unit-2">Ödüllerim ekranından kasada gösterebilirsin.</p>
</section>
<!-- Action Buttons -->
<section class="flex flex-col gap-unit-4 mt-unit-4">
<button class="w-full bg-primary text-on-primary font-title-sm text-title-sm py-unit-4 rounded-lg active:scale-95 transition-transform">
                Sonraki bölüm
            </button>
<button class="w-full bg-surface text-text-charcoal font-title-sm text-title-sm py-unit-4 rounded-lg border border-border-noble active:scale-95 transition-transform">
                Tekrar oyna
            </button>
<button class="w-full text-primary font-body-md text-body-md py-unit-2 hover:underline">

            </button>
</section>
