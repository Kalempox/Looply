<!-- baslik: Ürünler -->
<!-- govde: bg-surface-alt text-text-charcoal font-body-md antialiased min-h-screen -->

<!--
  D6 · /kafe/panel/urunler

  Ürünler tek başına ödül değil; ödülün ve kampanyanın DAYANAĞI. Panelde önce
  burası doldurulur.
-->

<main class="mx-auto w-full max-w-4xl px-margin-mobile py-unit-8 sm:px-unit-8">

  <header class="mb-unit-8 border-b border-border-noble pb-unit-6">
    <div class="font-label-caps text-label-caps text-text-muted">İŞLETME PANELİ</div>
    <h1 class="mt-unit-2 font-headline-md text-[30px] leading-[34px] tracking-[-0.02em] text-text-charcoal font-bold">Ürünler</h1>
    <p class="mt-unit-3 font-body-md text-body-md text-text-muted">Ödüllerin ve kampanyaların dayanağı.</p>
  </header>

  <section class="mb-unit-8">
    <h2 class="mb-unit-4 text-[13px] font-semibold text-text-charcoal">Yeni ürün</h2>
    <div class="rounded-lg border border-border-noble bg-surface p-unit-6">
      <div class="flex flex-col gap-unit-4 sm:flex-row sm:items-end">
        <label class="flex flex-1 flex-col gap-unit-1">
          <span class="text-[13px] font-semibold text-text-charcoal">Ürün adı</span>
          <input class="rounded-lg border border-border-noble bg-surface px-unit-4 py-unit-3 font-body-md text-body-md text-text-charcoal focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary" type="text"/>
        </label>
        <label class="flex w-full flex-col gap-unit-1 sm:w-40">
          <span class="text-[13px] font-semibold text-text-charcoal">Fiyat (TL)</span>
          <input class="tabular rounded-lg border border-border-noble bg-surface px-unit-4 py-unit-3 font-data-mono text-data-mono text-text-charcoal focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary" inputmode="numeric" type="text"/>
        </label>
        <button class="rounded-lg bg-text-charcoal px-unit-6 py-unit-3 font-title-sm text-title-sm text-white" type="button">Ekle</button>
      </div>
    </div>
  </section>

  <section class="mb-unit-8">
    <h2 class="mb-unit-4 text-[13px] font-semibold text-text-charcoal">Menü · 8 aktif</h2>
    <ul class="border-y border-border-noble">
      <li class="flex items-center gap-unit-4 border-b border-border-noble py-unit-3">
        <span class="min-w-0 flex-1">
          <span class="block font-body-md text-body-md font-semibold text-text-charcoal">Filtre kahve</span>
          <span class="tabular block font-data-mono text-[12px] text-text-muted font-medium">45 TL</span>
        </span>
        <button class="rounded border border-border-noble px-unit-3 py-unit-1 text-sm text-text-muted transition-colors hover:bg-surface-sunk" type="button">Kaldır</button>
      </li>
      <li class="flex items-center gap-unit-4 border-b border-border-noble py-unit-3">
        <span class="min-w-0 flex-1">
          <span class="block font-body-md text-body-md font-semibold text-text-charcoal">Americano</span>
          <span class="tabular block font-data-mono text-[12px] text-text-muted font-medium">50 TL</span>
        </span>
        <button class="rounded border border-border-noble px-unit-3 py-unit-1 text-sm text-text-muted transition-colors hover:bg-surface-sunk" type="button">Kaldır</button>
      </li>
      <li class="flex items-center gap-unit-4 border-b border-border-noble py-unit-3">
        <span class="min-w-0 flex-1">
          <span class="block font-body-md text-body-md font-semibold text-text-charcoal">Tiramisu</span>
          <span class="tabular block font-data-mono text-[12px] text-text-muted font-medium">120 TL</span>
        </span>
        <button class="rounded border border-border-noble px-unit-3 py-unit-1 text-sm text-text-muted transition-colors hover:bg-surface-sunk" type="button">Kaldır</button>
      </li>
      <li class="flex items-center gap-unit-4 py-unit-3 opacity-55">
        <span class="min-w-0 flex-1">
          <span class="block font-body-md text-body-md font-semibold text-text-charcoal">Soğuk demleme</span>
          <span class="tabular block font-data-mono text-[12px] text-text-muted font-medium">65 TL</span>
        </span>
        <span class="rounded border border-border-noble px-unit-2 py-1 font-label-caps text-[10px] tracking-[0.05em] text-text-muted font-semibold">KULLANIMDA DEĞİL</span>
        <button class="rounded border border-border-noble px-unit-3 py-unit-1 text-sm text-text-muted" type="button">Geri al</button>
      </li>
    </ul>

    <p class="mt-unit-4 text-sm text-text-muted">
      boş varyant · “Henüz ürün yok. Ödül tanımlayabilmek için önce menünü gir.”
    </p>
  </section>

  <a class="font-body-md text-body-md text-text-muted underline" href="#">Panele dön</a>
</main>
