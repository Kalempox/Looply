<!-- baslik: Giriş noktası -->
<!-- govde: bg-surface-alt text-text-charcoal font-body-md min-h-screen flex items-center justify-center py-unit-8 -->
<!-- gelistirme: numaralar -->

<main class="w-full max-w-[512px] px-margin-mobile mx-auto flex flex-col gap-unit-8">
<!-- Header -->
<header class="text-center flex flex-col gap-unit-4 mb-unit-4">
<h1 class="font-display-lg text-display-lg text-primary">CafePlay</h1>
<p class="font-body-md text-body-md text-text-muted max-w-sm mx-auto">
                Masadaki karekodu okut, oyna, kazandığın indirimi kasada kullan.
            </p>
</header>
<!-- OYUNCU Section -->
<section class="flex flex-col gap-unit-3">
<h2 class="font-data-mono text-data-mono text-text-muted uppercase tracking-widest pl-unit-1">OYUNCU</h2>
<button class="w-full bg-surface border border-primary rounded-xl p-unit-4 text-left flex flex-col gap-unit-1 active:scale-[0.98] transition-transform">
<span class="font-title-sm text-title-sm text-text-charcoal">Giriş yap</span>
<span class="font-body-md text-[14px] leading-tight text-text-muted font-normal">Numaran kayıtlıysa doğrudan girersin</span>
</button>
<button class="w-full bg-surface border border-border-noble rounded-xl p-unit-4 text-left flex flex-col gap-unit-1 active:scale-[0.98] transition-transform hover:border-border-noble">
<span class="font-title-sm text-title-sm text-text-charcoal">Karekodsuz gir</span>
<span class="font-body-md text-[14px] leading-tight text-text-muted font-normal">Kafe dışında: oynanır ama kazandırmaz</span>
</button>
</section>
<!-- İŞLETME Section -->
<section class="flex flex-col gap-unit-3 pt-unit-4">
<h2 class="font-data-mono text-data-mono text-text-muted uppercase tracking-widest pl-unit-1">İŞLETME</h2>
<button class="w-full bg-surface border border-primary rounded-xl p-unit-4 text-left flex flex-col gap-unit-1 active:scale-[0.98] transition-transform">
<span class="font-title-sm text-title-sm text-text-charcoal">Başvuru yap</span>
<span class="font-body-md text-[14px] leading-tight text-text-muted font-normal">Vergi levhasıyla, ücretsiz</span>
</button>
<button class="w-full bg-surface border border-border-noble rounded-xl p-unit-4 text-left flex flex-col gap-unit-1 active:scale-[0.98] transition-transform hover:border-border-noble">
<span class="font-title-sm text-title-sm text-text-charcoal">Panele gir</span>
<span class="font-body-md text-[14px] leading-tight text-text-muted font-normal">Yetkili numarasıyla</span>
</button>
</section>
<!-- PLATFORM Section -->
<section class="flex flex-col gap-unit-3 pt-unit-4">
<h2 class="font-data-mono text-data-mono text-text-muted uppercase tracking-widest pl-unit-1">PLATFORM</h2>
<button class="w-full bg-surface border border-border-noble rounded-xl p-unit-4 text-left flex flex-col gap-unit-1 active:scale-[0.98] transition-transform hover:border-border-noble">
<span class="font-title-sm text-title-sm text-text-charcoal">Platform girişi</span>
<span class="font-body-md text-[14px] leading-tight text-text-muted font-normal">Başvuruları inceler ve onaylar</span>
</button>
</section>
</main>
