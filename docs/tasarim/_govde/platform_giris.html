<!--
  E1 · /platform/giris — yalnızca platform ekibi.

  Sayfada başvuru bağlantısı YOK, kayıt yolu YOK. Buraya yalnızca listede olan
  numaralar giriyor ve o liste elle yönetiliyor.
-->

<main class="mx-auto w-full max-w-lg px-margin-mobile py-unit-8 sm:px-unit-8">

  <header class="mb-unit-8 border-b border-border-noble pb-unit-6">
    <div class="font-label-caps text-label-caps text-text-muted">CAFEPLAY</div>
    <h1 class="mt-unit-2 font-headline-md text-[30px] leading-[34px] tracking-[-0.02em] text-text-charcoal font-bold">Platform girişi</h1>
    <p class="mt-unit-3 font-body-md text-body-md text-text-muted">
      Yalnızca platform ekibi. Yetkili numaranla gir.
    </p>
  </header>

  <section class="mb-unit-8">
    <p class="mb-unit-4 font-label-caps text-label-caps text-text-muted">ADIM 1 · NUMARA</p>
    <form class="flex flex-col gap-unit-4">
      <label class="flex flex-col gap-unit-1">
        <span class="text-[13px] font-semibold text-text-charcoal">Cep telefonu</span>
        <input class="rounded-lg border border-border-noble bg-surface px-unit-4 py-unit-3 font-body-md text-body-md focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary" placeholder="0531 123 45 67" type="tel"/>
      </label>
      <button class="w-full rounded-lg bg-text-charcoal py-unit-3 font-title-sm text-title-sm text-white" type="button">Doğrulama kodu gönder</button>
    </form>
  </section>

  
</main>
