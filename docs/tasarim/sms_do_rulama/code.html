<!DOCTYPE html><html lang="tr"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>CafePlay - SMS doğrulama</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                "colors": {
                    "surface": "#FFFFFF",
                    "surface-alt": "#FAFAFA",
                    "surface-sunk": "#F2F2F2",
                    "surface-container-highest": "#e5e2e1",
                    "border-noble": "#E5E5E5",
                    "outline-variant": "#c3c6d6",
                    "text-charcoal": "#1F1F1F",
                    "text-muted": "#6B6B6B",
                    "on-surface": "#1b1b1c",
                    "on-surface-variant": "#424654",
                    "primary": "#0B57D0",
                    "on-primary": "#ffffff",
                    "on-primary-fixed-variant": "#0040a1",
                    "primary-fixed": "#dae2ff",
                    "reward-gold": "#D4AF37",
                    "reward-ink": "#856612",
                    "reward-fixed": "#FBF3DC",
                    "danger-red": "#D93025",
                    "danger-fixed": "#FDECEA"
                },
                "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "1rem",
                    "full": "9999px"
                },
                "spacing": {
                    "base": "4px",
                    "unit-1": "4px",
                    "unit-2": "8px",
                    "unit-3": "12px",
                    "unit-4": "16px",
                    "unit-6": "24px",
                    "unit-8": "32px",
                    "margin-mobile": "20px",
                    "gutter-mobile": "12px"
                },
                "fontFamily": {
                    "display-lg": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "headline-md": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "title-sm": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "body-md": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "label-caps": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "data-mono": ["JetBrains Mono", "ui-monospace", "SFMono-Regular", "monospace"],
                    "sans": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "mono": ["JetBrains Mono", "ui-monospace", "SFMono-Regular", "monospace"]
                },
                "fontSize": {
                    "display-lg": ["48px", { "lineHeight": "52px", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                    "headline-md": ["24px", { "lineHeight": "30px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                    "title-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                    "body-md": ["16px", { "lineHeight": "26px", "fontWeight": "400" }],
                    "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                    "data-mono": ["14px", { "lineHeight": "20px", "fontWeight": "500" }]
                }
            }
        }
    }
</script>
<style>
    /* Taban font — hiçbir metin tarayıcı varsayılanına düşmesin.
       Ekranlar arası "font farklı görünüyor" sorununun ikinci kaynağı buydu. */
    html, body, button, input, select, textarea {
        font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
    }
    /* İmza doku: ilerleme çubuklarının -45° çizgisi. */
    .noble-stripe {
        background-image: repeating-linear-gradient(
            -45deg,
            rgba(255, 255, 255, 0.15),
            rgba(255, 255, 255, 0.15) 10px,
            transparent 10px,
            transparent 20px
        );
    }
    .tabular { font-variant-numeric: tabular-nums; }
    ::-webkit-scrollbar { display: none; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: .01ms !important;
            transition-duration: .01ms !important;
        }
    }
</style>
</head>
<body class="bg-surface text-text-charcoal min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-fixed selection:text-primary">
<div class="sticky top-0 z-50 w-full border-b border-reward-gold bg-reward-fixed px-margin-mobile py-unit-3">
<div class="mx-auto flex w-full max-w-4xl items-center gap-unit-4">
<span class="material-symbols-outlined text-[20px] text-reward-ink">construction</span>
<div class="min-w-0 flex-1">
<div class="font-label-caps text-label-caps text-reward-ink">GELİŞTİRME · SMS GÖNDERİLMEDİ</div>
<div class="text-sm text-text-muted">Gerçek sağlayıcı bağlandığında bu şerit kaybolur.</div>
</div>
<span class="tabular shrink-0 font-data-mono text-[24px] font-bold tracking-[0.2em] text-text-charcoal">284913</span>
</div>
</div>
<!-- 
      TRANSACTIONAL SCREEN: Navigation Shell (TopAppBar/BottomNavBar) is intentionally SUPPRESSED 
      to focus user entirely on the verification task. 
    -->
<main class="flex-1 w-full max-w-md mx-auto px-margin-mobile pt-unit-8 flex flex-col h-full min-h-screen">
<!-- Top Section: Badge & Heading (Inherited from B1 context) -->
<header class="mb-unit-8 mt-unit-6">
<div class="w-12 h-12 rounded-xl bg-primary-fixed flex items-center justify-center mb-unit-6 border border-border-noble">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<h1 class="font-display-lg text-display-lg text-text-charcoal mb-unit-2">Önce seni tanıyalım</h1>
<p class="font-body-md text-body-md text-text-muted">0532 *** ** 67 numarasına gönderdiğimiz altı haneli kodu gir.</p>
</header>
<!-- Form Section -->
<form class="flex flex-col gap-unit-6 flex-1">
<!-- Input Field Group -->
<div class="flex flex-col gap-unit-2 relative">
<label class="font-label-caps text-label-caps text-text-muted ml-unit-2" for="verification_code">
                    DOĞRULAMA KODU
                </label>
<!-- 
                  ONE WIDE input: 
                  - background #F2F2F2 (surface-sunk)
                  - no border
                  - 8px radius (rounded-lg)
                  - monospace (font-data-mono)
                  - centered text
                  - tabular figures natively supported by JetBrains Mono
                -->
<input autocomplete="one-time-code" class="w-full bg-surface-sunk border-none rounded-lg h-[72px] text-center font-data-mono text-headline-md text-text-charcoal tracking-[0.5em] placeholder:tracking-normal placeholder:text-text-muted focus:ring-2 focus:ring-primary focus:outline-none" id="verification_code" inputmode="numeric" maxlength="6" placeholder="——————" type="text"/>
</div>
<!-- Solid Accent Button -->
<button class="w-full h-14 mt-unit-2 bg-primary text-on-primary font-title-sm text-title-sm rounded-lg flex items-center justify-center hover:bg-primary transition-colors active:scale-[0.98] duration-200" type="button">
                Doğrula ve gir
            </button>
</form>
<!-- Bottom Link Section -->
<footer class="mt-auto pb-unit-8 pt-unit-6 flex justify-center w-full border-t border-border-noble">
<a class="font-body-md text-body-md text-text-muted underline hover:text-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary rounded-sm px-2 py-1" href="#">
                Numarayı değiştir
            </a>
</footer>
</main>
<script src="../gezinme.js"></script>
</body></html>
