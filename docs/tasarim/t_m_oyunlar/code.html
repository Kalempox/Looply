<!DOCTYPE html><html lang="tr"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>CafePlay - Tüm oyunlar</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                "colors": {
                    "surface": "#FFFFFF",
                    "surface-alt": "#FAFAFA",
                    "surface-sunk": "#F2F2F2",
                    "surface-container-highest": "#e5e2e1",
                    "border-noble": "#E5E5E5",
                    "outline-variant": "#c3c6d6",
                    "text-charcoal": "#1F1F1F",
                    "text-muted": "#6B6B6B",
                    "on-surface": "#1b1b1c",
                    "on-surface-variant": "#424654",
                    "primary": "#0B57D0",
                    "on-primary": "#ffffff",
                    "on-primary-fixed-variant": "#0040a1",
                    "primary-fixed": "#dae2ff",
                    "reward-gold": "#D4AF37",
                    "reward-ink": "#856612",
                    "reward-fixed": "#FBF3DC",
                    "danger-red": "#D93025",
                    "danger-fixed": "#FDECEA"
                },
                "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "1rem",
                    "full": "9999px"
                },
                "spacing": {
                    "base": "4px",
                    "unit-1": "4px",
                    "unit-2": "8px",
                    "unit-3": "12px",
                    "unit-4": "16px",
                    "unit-6": "24px",
                    "unit-8": "32px",
                    "margin-mobile": "20px",
                    "gutter-mobile": "12px"
                },
                "fontFamily": {
                    "display-lg": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "headline-md": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "title-sm": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "body-md": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "label-caps": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "data-mono": ["JetBrains Mono", "ui-monospace", "SFMono-Regular", "monospace"],
                    "sans": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "mono": ["JetBrains Mono", "ui-monospace", "SFMono-Regular", "monospace"]
                },
                "fontSize": {
                    "display-lg": ["48px", { "lineHeight": "52px", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                    "headline-md": ["24px", { "lineHeight": "30px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                    "title-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                    "body-md": ["16px", { "lineHeight": "26px", "fontWeight": "400" }],
                    "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                    "data-mono": ["14px", { "lineHeight": "20px", "fontWeight": "500" }]
                }
            }
        }
    }
</script>
<style>
    /* Taban font — hiçbir metin tarayıcı varsayılanına düşmesin.
       Ekranlar arası "font farklı görünüyor" sorununun ikinci kaynağı buydu. */
    html, body, button, input, select, textarea {
        font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
    }
    /* İmza doku: ilerleme çubuklarının -45° çizgisi. */
    .noble-stripe {
        background-image: repeating-linear-gradient(
            -45deg,
            rgba(255, 255, 255, 0.15),
            rgba(255, 255, 255, 0.15) 10px,
            transparent 10px,
            transparent 20px
        );
    }
    .tabular { font-variant-numeric: tabular-nums; }
    ::-webkit-scrollbar { display: none; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: .01ms !important;
            transition-duration: .01ms !important;
        }
    }
</style>
</head>
<body class="bg-surface-alt text-text-charcoal font-body-md antialiased min-h-screen pb-24">
<!--
  B3b · /oyunlar — oyun listesi.

  Ana ekrandan AYRI duruyor çünkü oyun sayısı artacak. Ana ekranın tek kararı
  "bugünün oyunu"; katalog burada. Ü10: kategori YOK — filtre sekmesi, "popüler",
  "strateji" gibi ayrımlar ilk sürümde yapılmayacak. Liste düz ve tek eksenli,
  üç oyunda da otuz oyunda da aynı biçimde okunuyor.

  Arama alanı liste uzadığında işe yarıyor; kategori değil, aynı listenin
  daraltılmış hâli.
-->

<main class="mx-auto flex w-full max-w-md flex-col gap-unit-6 px-margin-mobile pt-unit-6">

  <a class="flex w-fit items-center gap-unit-2 text-text-muted" href="#">
    <span class="material-symbols-outlined text-[20px]">arrow_back</span>
    <span class="font-label-caps text-label-caps">OYNA</span>
  </a>

  <header class="flex flex-col gap-unit-1">
    <span class="font-label-caps text-label-caps text-text-muted">OYUNLAR</span>
    <h1 class="font-display-lg text-[40px] font-extrabold leading-[44px] tracking-[-0.04em] text-text-charcoal">Tüm oyunlar</h1>
  </header>

  <!-- Arama — liste uzadıkça anlamlanıyor -->
  <div class="flex items-center gap-unit-3 rounded-lg bg-surface-sunk px-unit-4 py-unit-3">
    <span class="material-symbols-outlined text-[20px] text-text-muted">search</span>
    <input class="w-full border-none bg-transparent p-0 font-body-md text-body-md text-text-charcoal placeholder:text-text-muted focus:ring-0" placeholder="Oyun ara" type="text"/>
  </div>

  <!-- Bugünün oyunu listenin başında, altın çerçeveyle -->
  <section class="flex flex-col gap-unit-3">
    <div class="flex items-baseline justify-between">
      <h2 class="font-label-caps text-label-caps text-reward-ink">BUGÜNÜN OYUNU</h2>
      <span class="font-data-mono text-[10px] font-medium text-reward-ink">×2 PUAN</span>
    </div>
    <button class="flex w-full items-center gap-unit-4 rounded-xl border border-reward-gold bg-surface p-unit-4 text-left transition-transform active:scale-[0.98]" type="button">
      <span class="flex h-12 w-12 shrink-0 items-center justify-center rounded-lg bg-reward-fixed">
        <span class="material-symbols-outlined text-[24px] text-reward-ink" style="font-variation-settings: 'FILL' 1;">grid_view</span>
      </span>
      <span class="min-w-0 flex-1">
        <span class="block font-title-sm text-title-sm text-text-charcoal">Blok</span>
        <span class="block font-body-md text-body-md text-text-muted">Parçaları yerleştir, satırları temizle</span>
        <span class="mt-unit-1 block font-label-caps text-label-caps text-text-muted">5 BÖLÜM</span>
      </span>
      <span class="material-symbols-outlined text-[20px] text-reward-ink">arrow_forward</span>
    </button>
  </section>

  <!-- Katalog — tek eksenli liste, oyun sayısı arttıkça uzar -->
  <section class="flex flex-col gap-unit-3">
    <h2 class="font-label-caps text-label-caps text-text-muted">HEPSİ · 3 OYUN</h2>

    <ul class="overflow-hidden rounded-xl border border-border-noble bg-surface">
      <li class="border-b border-border-noble">
        <button class="flex w-full items-center gap-unit-4 p-unit-4 text-left transition-colors hover:bg-surface-sunk" type="button">
          <span class="flex h-12 w-12 shrink-0 items-center justify-center rounded-lg bg-surface-sunk">
            <span class="material-symbols-outlined text-[24px] text-primary">grid_view</span>
          </span>
          <span class="min-w-0 flex-1">
            <span class="block font-title-sm text-title-sm text-text-charcoal">Blok</span>
            <span class="block font-body-md text-body-md text-text-muted">Parçaları yerleştir, satırları temizle</span>
          </span>
          <span class="font-label-caps text-label-caps text-text-muted">5 BÖLÜM</span>
        </button>
      </li>

      <li class="border-b border-border-noble">
        <button class="flex w-full items-center gap-unit-4 p-unit-4 text-left transition-colors hover:bg-surface-sunk" type="button">
          <span class="flex h-12 w-12 shrink-0 items-center justify-center rounded-lg bg-surface-sunk">
            <span class="material-symbols-outlined text-[24px] text-primary">abc</span>
          </span>
          <span class="min-w-0 flex-1">
            <span class="block font-title-sm text-title-sm text-text-charcoal">Kelime</span>
            <span class="block font-body-md text-body-md text-text-muted">Harflerden kelime çıkar</span>
          </span>
          <span class="font-label-caps text-label-caps text-text-muted">5 BÖLÜM</span>
        </button>
      </li>

      <li>
        <button class="flex w-full items-center gap-unit-4 p-unit-4 text-left transition-colors hover:bg-surface-sunk" type="button">
          <span class="flex h-12 w-12 shrink-0 items-center justify-center rounded-lg bg-surface-sunk">
            <span class="material-symbols-outlined text-[24px] text-primary">stacked_bar_chart</span>
          </span>
          <span class="min-w-0 flex-1">
            <span class="block font-title-sm text-title-sm text-text-charcoal">Düşen</span>
            <span class="block font-body-md text-body-md text-text-muted">İnen parçalarla satır doldur</span>
          </span>
          <span class="font-label-caps text-label-caps text-text-muted">5 BÖLÜM</span>
        </button>
      </li>
    </ul>

    <p class="text-sm leading-relaxed text-text-muted">
      Oyunlar partiler hâlinde eklenir. Yeni oyun geldiğinde bu listeye düşer —
      ana ekranın düzeni değişmez.
    </p>
  </section>
</main>

<!-- Alt gezinme — üç durak -->
<nav class="fixed bottom-0 left-0 z-50 flex w-full items-center justify-around border-t border-border-noble bg-surface px-unit-4 py-unit-3 pb-safe">
  <a class="flex flex-col items-center justify-center rounded-lg p-2 font-bold text-primary" href="#">
    <span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">games</span>
    <span class="font-label-caps text-label-caps text-[10px] font-semibold tracking-[0.05em]">Oyna</span>
  </a>
  <a class="flex flex-col items-center justify-center rounded-lg p-2 text-text-muted transition-colors hover:bg-surface-sunk" href="#">
    <span class="material-symbols-outlined mb-1">card_giftcard</span>
    <span class="font-label-caps text-label-caps text-[10px] font-semibold tracking-[0.05em]">Ödüllerim</span>
  </a>
  <a class="flex flex-col items-center justify-center rounded-lg p-2 text-text-muted transition-colors hover:bg-surface-sunk" href="#">
    <span class="material-symbols-outlined mb-1">person</span>
    <span class="font-label-caps text-label-caps text-[10px] font-semibold tracking-[0.05em]">Profilim</span>
  </a>
</nav>
<script src="../gezinme.js"></script>
</body></html>
