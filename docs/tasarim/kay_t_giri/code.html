<!DOCTYPE html><html lang="tr"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>CafePlay - Kayıt / giriş</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                "colors": {
                    "surface": "#FFFFFF",
                    "surface-alt": "#FAFAFA",
                    "surface-sunk": "#F2F2F2",
                    "surface-container-highest": "#e5e2e1",
                    "border-noble": "#E5E5E5",
                    "outline-variant": "#c3c6d6",
                    "text-charcoal": "#1F1F1F",
                    "text-muted": "#6B6B6B",
                    "on-surface": "#1b1b1c",
                    "on-surface-variant": "#424654",
                    "primary": "#0B57D0",
                    "on-primary": "#ffffff",
                    "on-primary-fixed-variant": "#0040a1",
                    "primary-fixed": "#dae2ff",
                    "reward-gold": "#D4AF37",
                    "reward-ink": "#856612",
                    "reward-fixed": "#FBF3DC",
                    "danger-red": "#D93025",
                    "danger-fixed": "#FDECEA"
                },
                "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "1rem",
                    "full": "9999px"
                },
                "spacing": {
                    "base": "4px",
                    "unit-1": "4px",
                    "unit-2": "8px",
                    "unit-3": "12px",
                    "unit-4": "16px",
                    "unit-6": "24px",
                    "unit-8": "32px",
                    "margin-mobile": "20px",
                    "gutter-mobile": "12px"
                },
                "fontFamily": {
                    "display-lg": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "headline-md": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "title-sm": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "body-md": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "label-caps": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "data-mono": ["JetBrains Mono", "ui-monospace", "SFMono-Regular", "monospace"],
                    "sans": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "mono": ["JetBrains Mono", "ui-monospace", "SFMono-Regular", "monospace"]
                },
                "fontSize": {
                    "display-lg": ["48px", { "lineHeight": "52px", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                    "headline-md": ["24px", { "lineHeight": "30px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                    "title-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                    "body-md": ["16px", { "lineHeight": "26px", "fontWeight": "400" }],
                    "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                    "data-mono": ["14px", { "lineHeight": "20px", "fontWeight": "500" }]
                }
            }
        }
    }
</script>
<style>
    /* Taban font — hiçbir metin tarayıcı varsayılanına düşmesin.
       Ekranlar arası "font farklı görünüyor" sorununun ikinci kaynağı buydu. */
    html, body, button, input, select, textarea {
        font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
    }
    /* İmza doku: ilerleme çubuklarının -45° çizgisi. */
    .noble-stripe {
        background-image: repeating-linear-gradient(
            -45deg,
            rgba(255, 255, 255, 0.15),
            rgba(255, 255, 255, 0.15) 10px,
            transparent 10px,
            transparent 20px
        );
    }
    .tabular { font-variant-numeric: tabular-nums; }
    ::-webkit-scrollbar { display: none; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: .01ms !important;
            transition-duration: .01ms !important;
        }
    }
</style>
</head>
<body class="bg-surface-alt text-text-charcoal font-body-md antialiased min-h-screen flex flex-col items-center justify-start pt-unit-8 pb-unit-8 px-margin-mobile">
<div class="w-full max-w-md bg-surface border border-border-noble rounded-xl p-unit-6 flex flex-col gap-unit-6 shadow-[0px_4px_20px_rgba(0,0,0,0.04)]">
<!-- Table Badge -->
<div class="flex flex-col gap-unit-1">
<span class="font-label-caps text-label-caps text-text-muted">BURADASIN</span>
<div class="flex items-center gap-unit-2">
<span class="material-symbols-outlined text-primary" data-weight="fill" style="font-variation-settings: 'FILL' 1;">location_on</span>
<span class="font-title-sm text-title-sm text-text-charcoal">Kahve Durağı · Masa 3</span>
</div>
</div>
<!-- Heading -->
<div class="flex flex-col gap-unit-1">
<span class="font-label-caps text-label-caps text-primary">OYUNA BAŞLA</span>
<h1 class="font-headline-md text-headline-md text-text-charcoal">Önce seni tanıyalım</h1>
</div>
<!-- Form -->
<form class="flex flex-col gap-unit-4">
<div class="flex flex-col gap-unit-1">
<label class="font-label-caps text-label-caps text-text-muted" for="phone">CEP TELEFONU</label>
<input class="bg-surface-sunk border-none rounded-lg p-unit-3 text-text-charcoal font-body-md focus:ring-2 focus:ring-primary focus:outline-none placeholder:text-text-muted" id="phone" placeholder="0555 555 55 55" type="tel"/>
</div>
<div class="flex flex-col gap-unit-1">
<label class="font-label-caps text-label-caps text-text-muted" for="name">AD</label>
<input class="bg-surface-sunk border-none rounded-lg p-unit-3 text-text-charcoal font-body-md focus:ring-2 focus:ring-primary focus:outline-none placeholder:text-text-muted" id="name" placeholder="Adınız" type="text"/>
</div>
<div class="flex flex-col gap-unit-1">
<label class="font-label-caps text-label-caps text-text-muted" for="surname">SOYAD</label>
<input class="bg-surface-sunk border-none rounded-lg p-unit-3 text-text-charcoal font-body-md focus:ring-2 focus:ring-primary focus:outline-none placeholder:text-text-muted" id="surname" placeholder="Soyadınız" type="text"/>
</div>
<div class="flex flex-col gap-unit-1">
<label class="font-label-caps text-label-caps text-text-muted" for="birthyear">DOĞUM YILI</label>
<input class="bg-surface-sunk border-none rounded-lg p-unit-3 text-text-charcoal font-body-md focus:ring-2 focus:ring-primary focus:outline-none placeholder:text-text-muted" id="birthyear" placeholder="YYYY" type="number"/>
</div>
<!-- Consent -->
<div class="flex flex-col gap-unit-3 mt-unit-2">
<label class="flex items-start gap-unit-3 cursor-pointer">
<!-- G7 / KVKK açık rıza: kutu İŞARETSİZ başlar. Önceden işaretli gelen onay
     "açık rıza" sayılmaz — kullanıcının kendi eylemi olmalı. -->
<input class="mt-1 w-5 h-5 rounded border-border-noble text-primary focus:ring-primary bg-surface" type="checkbox"/>
<span class="font-body-md text-body-md text-text-muted text-sm leading-tight">
                        <a class="text-primary underline" href="#">Aydınlatma metnini</a> okudum ve kişisel verilerimin işlenmesini kabul ediyorum.
                    </span>
</label>
<label class="flex items-start gap-unit-3 cursor-pointer">
<input class="mt-1 w-5 h-5 rounded border-border-noble text-primary focus:ring-primary bg-surface" type="checkbox"/>
<span class="font-body-md text-body-md text-text-muted text-sm leading-tight">
                        Kampanya mesajları almak istiyorum.
                    </span>
</label>
</div>
<!-- Button -->
<button class="mt-unit-4 w-full bg-primary text-on-primary font-title-sm text-title-sm py-unit-3 rounded-lg hover:bg-primary transition-colors active:scale-95 duration-200 flex items-center justify-center gap-unit-2" type="button">
<span>Doğrulama kodu gönder</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Footer -->
<div class="mt-unit-2 text-center">
<p class="font-data-mono text-data-mono text-[10px] text-text-muted font-medium">
                Telefon numaran şifreli saklanır ve üye işletmelerle paylaşılmaz.
                Kafeler seni yalnızca sana özel anonim bir kodla görür.
            </p>
</div>
</div>
<script src="../gezinme.js"></script>
</body></html>
