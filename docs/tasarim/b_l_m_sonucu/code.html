<!DOCTYPE html><html lang="tr"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>CafePlay - Bölüm sonucu</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                "colors": {
                    "surface": "#FFFFFF",
                    "surface-alt": "#FAFAFA",
                    "surface-sunk": "#F2F2F2",
                    "surface-container-highest": "#e5e2e1",
                    "border-noble": "#E5E5E5",
                    "outline-variant": "#c3c6d6",
                    "text-charcoal": "#1F1F1F",
                    "text-muted": "#6B6B6B",
                    "on-surface": "#1b1b1c",
                    "on-surface-variant": "#424654",
                    "primary": "#0B57D0",
                    "on-primary": "#ffffff",
                    "on-primary-fixed-variant": "#0040a1",
                    "primary-fixed": "#dae2ff",
                    "reward-gold": "#D4AF37",
                    "reward-ink": "#856612",
                    "reward-fixed": "#FBF3DC",
                    "danger-red": "#D93025",
                    "danger-fixed": "#FDECEA"
                },
                "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "1rem",
                    "full": "9999px"
                },
                "spacing": {
                    "base": "4px",
                    "unit-1": "4px",
                    "unit-2": "8px",
                    "unit-3": "12px",
                    "unit-4": "16px",
                    "unit-6": "24px",
                    "unit-8": "32px",
                    "margin-mobile": "20px",
                    "gutter-mobile": "12px"
                },
                "fontFamily": {
                    "display-lg": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "headline-md": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "title-sm": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "body-md": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "label-caps": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "data-mono": ["JetBrains Mono", "ui-monospace", "SFMono-Regular", "monospace"],
                    "sans": ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
                    "mono": ["JetBrains Mono", "ui-monospace", "SFMono-Regular", "monospace"]
                },
                "fontSize": {
                    "display-lg": ["48px", { "lineHeight": "52px", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                    "headline-md": ["24px", { "lineHeight": "30px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                    "title-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                    "body-md": ["16px", { "lineHeight": "26px", "fontWeight": "400" }],
                    "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                    "data-mono": ["14px", { "lineHeight": "20px", "fontWeight": "500" }]
                }
            }
        }
    }
</script>
<style>
    /* Taban font — hiçbir metin tarayıcı varsayılanına düşmesin.
       Ekranlar arası "font farklı görünüyor" sorununun ikinci kaynağı buydu. */
    html, body, button, input, select, textarea {
        font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
    }
    /* İmza doku: ilerleme çubuklarının -45° çizgisi. */
    .noble-stripe {
        background-image: repeating-linear-gradient(
            -45deg,
            rgba(255, 255, 255, 0.15),
            rgba(255, 255, 255, 0.15) 10px,
            transparent 10px,
            transparent 20px
        );
    }
    .tabular { font-variant-numeric: tabular-nums; }
    ::-webkit-scrollbar { display: none; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: .01ms !important;
            transition-duration: .01ms !important;
        }
    }
</style>
</head>
<body class="bg-surface-alt text-text-charcoal font-body-md min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<!-- Top Navigation Placeholder (Suppressed for Task-Focused flow) -->
<main class="w-full max-w-md flex flex-col gap-unit-8">
<!-- Result Card -->
<section class="bg-surface rounded-xl border border-primary p-unit-6 flex flex-col items-center text-center gap-unit-4 shadow-[0px_4px_20px_rgba(0,0,0,0.04)]">
<span class="font-label-caps text-label-caps text-text-muted">BLOK · 1. BÖLÜM</span>
<h2 class="font-headline-md text-headline-md text-text-charcoal">Bölüm tamam</h2>
<!-- SKOR ≠ PUAN. Skor oyunun sonucu, puan kazanımdır (aşağıda +300).
     İkisi karışırsa oyuncu 1.240 puan kazandığını sanar. -->
<span class="font-label-caps text-label-caps text-text-muted">SKOR</span>
<div class="tabular font-data-mono text-display-lg text-primary">1.240</div>
<span class="font-data-mono text-[11px] font-medium text-text-muted">sunucuda doğrulandı</span>
</section>
<!-- Earnings Rows -->
<section class="bg-surface rounded-xl border border-border-noble p-unit-4 flex flex-col gap-unit-4">
<div class="flex justify-between items-center border-b border-border-noble pb-unit-3">
<span class="font-body-md text-body-md text-text-charcoal">Bölüm Puanı</span>
<span class="font-data-mono text-data-mono text-primary font-bold">+300 puan</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-text-charcoal">Tecrübe Puanı (XP)</span>
<span class="font-data-mono text-data-mono text-reward-ink font-bold">+50 XP</span>
</div>
</section>
<!-- Reward Card -->
<section class="bg-surface rounded-xl border border-reward-gold p-unit-6 flex flex-col gap-unit-2 items-center text-center">
<div class="flex items-center gap-unit-2">
<span class="material-symbols-outlined text-reward-ink" style="font-variation-settings: 'FILL' 1;">local_activity</span>
<span class="font-label-caps text-label-caps text-reward-ink">ÖDÜL KAZANDIN</span>
</div>
<h3 class="font-title-sm text-title-sm text-text-charcoal">Ücretsiz kurabiye</h3>
<!-- E9: oyuncunun ekranı geçerlilik BEYAN EDEMEZ. Nereden kullanılacağını söyler, o kadar. -->
<p class="font-body-md text-body-md text-text-muted text-sm mt-unit-2">Ödüllerim ekranından kasada gösterebilirsin.</p>
</section>
<!-- Action Buttons -->
<section class="flex flex-col gap-unit-4 mt-unit-4">
<button class="w-full bg-primary text-on-primary font-title-sm text-title-sm py-unit-4 rounded-lg active:scale-95 transition-transform">
                Sonraki bölüm
            </button>
<button class="w-full bg-surface text-text-charcoal font-title-sm text-title-sm py-unit-4 rounded-lg border border-border-noble active:scale-95 transition-transform">
                Tekrar oyna
            </button>
<button class="w-full text-primary font-body-md text-body-md py-unit-2 hover:underline">
                Bölümlere dön
            </button>
</section>
</main>
<!-- Bottom Navigation Placeholder (Suppressed for Task-Focused flow) -->
<script src="../gezinme.js"></script>
</body></html>
